name: Flutter CD

# Only build/upload artifacts once CI has actually passed on this branch —
# previously this ran on every push independently of the `flutter analyze &
# test` job in CI, so a build could be uploaded from code whose own tests
# were failing.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [flutter]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  build-web:
    name: Build Flutter Web
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.3"
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: mobile
      - run: flutter build web --release
        working-directory: mobile
      - name: Upload Web Build
        uses: actions/upload-artifact@v4
        with:
          name: flutter-web
          path: mobile/build/web
          retention-days: 7

  build-android:
    name: Build Flutter Android (APK)
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.3"
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: mobile
      - run: flutter build apk --debug
        working-directory: mobile
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: flutter-android-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7